<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Energy Price Graph Card preview</title>
<style>
  :root {
    --primary-text-color: #212121;
    --secondary-text-color: #727272;
    --card-background-color: #fff;
    --error-color: #db4437;
    --page-bg: #f2f2f7;
  }
  html[data-theme="dark"] {
    --primary-text-color: #e1e1e1;
    --secondary-text-color: #9b9b9b;
    --card-background-color: #1c1c1e;
    --page-bg: #111;
  }
  body { margin: 0; padding: 16px; background: var(--page-bg); font-family: Roboto, "Segoe UI", sans-serif; }
  #card { max-width: 560px; }
</style>
</head>
<body>
<div id="card"></div>
<script>
  // Stand-in for HA's <ha-card>.
  customElements.define('ha-card', class extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: 'open' }).innerHTML =
        '<style>:host{display:block;background:var(--card-background-color);border-radius:12px;color:var(--primary-text-color)}</style><slot></slot>';
    }
  });

  const q = new URLSearchParams(location.search);
  const dark = q.get('theme') === 'dark';
  const scenario = q.get('scenario') || 'default';
  // entity=pence: the rate entities report pence (use with cfg={"rate_multiplier":1}) instead of £
  const blank = q.get('blank') === '1'; // rate sensors report '' instead of a number
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  if (q.get('width')) document.getElementById('card').style.width = `${q.get('width')}px`;

  // Pin "now" so screenshots are reproducible (default 17:10 local).
  const [hh, mm] = (q.get('time') || '17:10').split(':').map(Number);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const fixedNow = today.getTime() + (hh * 60 + mm) * 60000;
  Date.now = () => fixedNow;

  // Agile-style half-hourly prices in pence: overnight dip, morning bump, evening peak.
  const pence = (h) => {
    const g = (c, w, a) => a * Math.exp(-(((h - c) / w) ** 2));
    let p = 14 + g(8, 1.6, 8) + g(17.5, 1.7, 22) + g(13, 2.5, -6) + g(3, 2.2, -19);
    if (scenario === 'flat') p = 24 + g(17.5, 2, 4);
    return p;
  };
  const day = (offset) =>
    Array.from({ length: 48 }, (_, i) => {
      const start = today.getTime() + offset * 864e5 + i * 18e5;
      return {
        start: new Date(start).toISOString(),
        end: new Date(start + 18e5).toISOString(),
        value_inc_vat: Math.round(pence(((start - today.getTime()) / 36e5) % 24) * 10) / (q.get('entity') === 'pence' ? 10 : 1000),
      };
    });

  // until=HH: the published rates stop at HH:00 (0-48, hours since midnight today), as when tomorrow isn't out yet.
  const until = q.get('until') ? today.getTime() + Number(q.get('until')) * 36e5 : Infinity;
  const publishedBy = (rates) => rates.filter((r) => Date.parse(r.end) <= until);
  const today_rates = publishedBy(day(0));
  const tomorrow_rates = publishedBy(day(1));
  const slot = (t) => today_rates.concat(tomorrow_rates).find((r) => Date.parse(r.start) <= t && t < Date.parse(r.end));
  const cur = slot(fixedNow), next = slot(fixedNow + 18e5);
  const sessionStart = today.getTime() + 17 * 36e5 + 30 * 6e4;

  const states = {
    'event.import_current_day_rates': { state: 'x', attributes: { rates: today_rates } },
    'event.import_next_day_rates': { state: 'x', attributes: { rates: tomorrow_rates } },
    'sensor.import_current_rate': { state: blank ? '' : String(cur.value_inc_vat), attributes: { rate: { valid_from: cur.start } } },
    'sensor.import_next_rate': { state: blank ? '' : String(next.value_inc_vat), attributes: { rate: { valid_from: next.start } } },
    'event.account_octoplus_power_down_events': {
      state: 'x',
      attributes: {
        joined_events: scenario === 'nosession' ? [] : [
          { start: new Date(sessionStart).toISOString(), end: new Date(sessionStart + 36e5).toISOString() },
        ],
      },
    },
  };

  // predbat=1: a Predbat plan like the real predbat.best_*_limit entities (change points, %z offsets with no colon).
  // Windows are hours since midnight today: [start, end, target %].
  if (q.get('predbat') === '1') {
    const stamp = (h) => {
      const d = new Date(today.getTime() + Math.round(h * 60) * 6e4);
      const p = (n) => String(n).padStart(2, '0');
      const off = -d.getTimezoneOffset();
      const zone = `${off < 0 ? '-' : '+'}${p(Math.trunc(Math.abs(off) / 60))}${p(Math.abs(off) % 60)}`;
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}${zone}`;
    };
    const results = (windows, idle) => {
      const out = { [stamp(0)]: idle };
      for (const [start, end, pct] of windows) { out[stamp(start)] = pct; out[stamp(end)] = idle; }
      return out;
    };
    const charge = [[2, 2.17, 100], [2.5, 4, 100], [4.5, 5, 100], [8, 9.33, 100], [12, 12.17, 100], [13, 14.25, 100],
      [15, 16, 100], [23, 23.75, 100], [24, 24.92, 100], [25, 42.5, 100]];
    const discharge = [[1, 2, 15], [2.17, 2.5, 6], [4, 4.5, 51], [9.67, 12, 16], [14.25, 15, 40], [17.5, 19, 16],
      [21.5, 22.5, 16], [22.67, 23, 1], [23.75, 24, 24], [24.92, 25, 64]];
    // predbat.rates: predicted import rates in pence for every half hour, yesterday to tomorrow, keyed like the plan.
    // They differ a little from the published ones so a real vs predicted mismatch would show.
    const rates = {};
    for (let i = -48; i < 96; i++) {
      const h = i / 2;
      rates[stamp(h)] = Math.round((pence(((h % 24) + 24) % 24) + 1.5) * 100) / 100;
    }
    states['predbat.rates'] = { state: '14', attributes: { results: rates } };
    states['predbat.best_charge_limit'] = { state: '100', attributes: { results: results(charge, 0) } };
    states['predbat.best_export_limit'] = { state: '15', attributes: { results: results(discharge, 100) } };
  }

  const script = document.createElement('script');
  script.type = 'module';
  script.src = '../dist/energy-price-graph-card.js';
  script.onload = () => {
    const el = document.createElement('energy-price-graph-card');
    el.setConfig({
      type: 'custom:energy-price-graph-card',
      current_rate_entity: 'sensor.import_current_rate',
      next_rate_entity: 'sensor.import_next_rate',
      current_day_rates_entity: 'event.import_current_day_rates',
      next_day_rates_entity: 'event.import_next_day_rates',
      incentive_events_entity: 'event.account_octoplus_power_down_events',
      ...(q.get('predbat') === '1' ? { predbat_prefix: 'predbat' } : {}),
      ...JSON.parse(q.get('cfg') || '{}'), // e.g. cfg={"hours":0} to override card config
    });
    el.hass = { states, themes: { darkMode: dark } };
    document.getElementById('card').appendChild(el);
  };
  document.head.appendChild(script);
</script>
</body>
</html>
