name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, labeled]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude') || github.event.action == 'labeled'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write # Required to assign the issue to claude[bot] below
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # The "claude" bot doesn't show up in the Assignees picker (only
          # real collaborators do), so applying the "claude" label is the
          # UI-visible alternative: anyone can pick it from the Labels
          # menu. The `if:` above widens to any 'labeled' action; this
          # input still only fires when the applied label is really
          # "claude" (a no-op job otherwise).
          label_trigger: 'claude'

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          #
          # Node deps are installed above, but Claude still needs explicit Bash
          # permission to run them (no interactive approval in CI) so it can
          # actually run tests/lint/build and generate before/after screenshots
          # per CLAUDE.md instead of skipping verification.
          claude_args: >-
            --allowedTools "Bash(npm ci),Bash(npm run typecheck),Bash(npm run lint),Bash(npm run lint:fix),Bash(npm test),Bash(npm run build),Bash(npm run size),Bash(npm run test:e2e),Bash(npm run screenshot),Bash(npm run screenshot *)"

      - name: Assign the issue to claude[bot]
        # Runs after Claude Code, not before: GitHub only accepts claude[bot]
        # as an assignee once it's already a participant on the issue (has
        # commented), and the step above is what makes that happen on a
        # fresh issue. Assigning any earlier reliably 422s ("invalid
        # assignee"). Non-blocking either way - this is cosmetic, the
        # label_trigger above already did the real work.
        if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue edit "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --add-assignee 'claude[bot]' || true

