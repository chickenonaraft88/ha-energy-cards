name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    # Dependabot's titles are generated; see dependabot.yml for their prefix.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # Conventional Commits, see "PR titles" in CLAUDE.md. Release notes and the version bump come from these titles.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            ci
            build
            chore
            deps
          scopes: |
            chart
            predbat
            config
            colors
            axis
            release
            deps
          # The scope is optional.
          requireScope: false
          subjectPattern: ^[a-z0-9].*[^.]$
          subjectPatternError: |
            The summary "{subject}" in the PR title should start lowercase (or a digit) and not end with a full stop.
