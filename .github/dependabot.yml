version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # PR titles follow the convention in CLAUDE.md: "deps: Bump ..."
    commit-message:
      prefix: deps
    groups:
      # Only minor/patch dev updates are grouped (and auto-merged, see
      # workflows/dependabot-auto-merge.yml). Majors come as separate PRs.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # "ci(deps): Bump ..."
    commit-message:
      prefix: ci
      include: scope
